<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Ahmed Musa Mohammed is a QHSE Coordinator and process safety professional with experience in QHSE systems, risk assessment, and operational excellence."
    />
    <title>Ahmed Musa Mohammed | QHSE Coordinator</title>
    <script defer src="profile.js"></script>
    <style>
      :root {
        --bg: #f4efe7;
        --bg-strong: #ebe2d2;
        --panel: rgba(255, 255, 255, 0.78);
        --panel-strong: #f8f3ed;
        --ink: #17181a;
        --muted: #596268;
        --line: rgba(23, 24, 26, 0.12);
        --accent: #b76d1b;
        --accent-deep: #8a5115;
        --accent-soft: #f5e6d2;
        --shadow: 0 24px 52px rgba(22, 22, 24, 0.08);
        --success: #2f6d57;
      }

      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        font-family: "Segoe UI", Arial, sans-serif;
        background:
          radial-gradient(circle at top left, rgba(183, 109, 27, 0.08), transparent 30%),
          linear-gradient(180deg, var(--bg) 0%, #f9f6f2 100%);
        color: var(--ink);
        line-height: 1.7;
      }

      img { max-width: 100%; display: block; }
      a { color: inherit; text-decoration: none; }
      p { margin: 0; }

      .container {
        width: min(1180px, calc(100% - 32px));
        margin: 0 auto;
      }

      .site-header {
        position: sticky;
        top: 0;
        z-index: 20;
        background: rgba(244, 239, 231, 0.82);
        backdrop-filter: blur(16px);
        border-bottom: 1px solid var(--line);
      }

      .header-inner {
        display: flex;
        justify-content: space-between;
        align-items: center;
        min-height: 76px;
        gap: 16px;
      }

      .brand {
        font-size: 0.82rem;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        font-weight: 800;
      }

      .nav {
        display: flex;
        align-items: center;
        gap: 24px;
        flex-wrap: wrap;
      }

      .nav a {
        font-size: 0.75rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
        position: relative;
      }

      .nav a::after {
        content: "";
        position: absolute;
        left: 0;
        bottom: -6px;
        width: 100%;
        height: 1px;
        background: var(--accent);
        transform: scaleX(0);
        transform-origin: left;
        transition: transform 0.2s ease;
      }

      .nav a:hover { color: var(--ink); }
      .nav a:hover::after { transform: scaleX(1); }

      .hero {
        padding: 72px 0 48px;
      }

      .hero-grid {
        display: grid;
        grid-template-columns: 1.2fr 0.8fr;
        gap: 42px;
        align-items: center;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-size: 0.72rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--accent-deep);
        font-weight: 700;
      }

      .eyebrow::before {
        content: "";
        width: 32px;
        height: 1px;
        background: var(--accent-deep);
      }

      h1 {
        margin: 18px 0 0;
        font-size: clamp(3rem, 6vw, 5.5rem);
        line-height: 0.96;
        letter-spacing: -0.07em;
      }

      .hero-sub {
        margin-top: 22px;
        max-width: 680px;
        font-size: 1.08rem;
        color: var(--muted);
      }

      .hero-actions {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
        margin-top: 28px;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        border-radius: 999px;
        padding: 0 22px;
        border: 1px solid var(--line);
        font-size: 0.75rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        font-weight: 800;
        transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      }

      .button:hover {
        transform: translateY(-1px);
        box-shadow: var(--shadow);
      }

      .button.primary {
        background: var(--ink);
        border-color: var(--ink);
        color: white;
      }

      .button.secondary {
        background: rgba(255,255,255,0.4);
        color: var(--ink);
      }

      .portrait-wrap {
        position: relative;
      }

      .portrait-card {
        position: relative;
        background: linear-gradient(180deg, #f9f3ea 0%, #efe5d6 100%);
        border: 1px solid var(--line);
        padding: 22px;
        border-radius: 32px;
        box-shadow: var(--shadow);
      }

      .portrait {
        overflow: hidden;
        border-radius: 28px;
        background: linear-gradient(135deg, #e6ddd0, #d4c1a3);
        border: 1px solid rgba(23, 24, 26, 0.08);
        aspect-ratio: 4 / 5;
      }

      .portrait img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .mini-badge {
        position: absolute;
        right: 18px;
        bottom: 22px;
        background: rgba(255,255,255,0.9);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 8px 12px;
        font-size: 0.7rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        font-weight: 800;
      }

      .section {
        padding: 30px 0 6px;
      }

      .section-header {
        display: flex;
        justify-content: space-between;
        align-items: end;
        gap: 16px;
        margin-bottom: 20px;
      }

      .section-header h2 {
        margin: 0;
        font-size: clamp(2rem, 3vw, 3rem);
        letter-spacing: -0.06em;
      }

      .section-header span {
        color: var(--muted);
        font-size: 0.72rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .about-grid {
        display: grid;
        grid-template-columns: 1.1fr 0.9fr;
        gap: 22px;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 26px;
        padding: 30px;
        box-shadow: 0 10px 26px rgba(26, 28, 29, 0.03);
      }

      .panel p {
        color: var(--muted);
        font-size: 1.05rem;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(2, minmax(140px, 1fr));
        gap: 16px;
      }

      .stat {
        background: var(--panel-strong);
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 20px 18px;
      }

      .stat strong {
        display: block;
        font-size: clamp(1.8rem, 2vw, 2.4rem);
        letter-spacing: -0.06em;
      }

      .stat span {
        display: block;
        margin-top: 8px;
        color: var(--muted);
        font-size: 0.88rem;
      }

      .expertise {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
        gap: 12px;
        margin-top: 18px;
      }

      .chip {
        background: rgba(255,255,255,0.6);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 14px 12px;
        font-size: 0.94rem;
        font-weight: 600;
        color: var(--ink);
      }

      .metrics {
        display: grid;
        grid-template-columns: repeat(3, minmax(180px, 1fr));
        gap: 16px;
        margin-top: 22px;
      }

      .metric {
        background: linear-gradient(180deg, rgba(255,255,255,0.7), rgba(248,243,237,0.8));
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 18px 16px;
      }

      .metric strong {
        display: block;
        font-size: 1.9rem;
        letter-spacing: -0.06em;
        color: var(--accent-deep);
      }

      .metric span {
        display: block;
        margin-top: 8px;
        color: var(--muted);
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .experience-list {
        display: grid;
        gap: 18px;
      }

      .job {
        background: var(--panel);
        border: 1px solid var(--line);
        border-left: 4px solid var(--accent);
        border-radius: 22px;
        padding: 22px 20px;
        box-shadow: 0 10px 26px rgba(26, 28, 29, 0.02);
      }

      .job-head {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
        align-items: center;
        margin-bottom: 6px;
      }

      .job h3 {
        margin: 0;
        font-size: 1.2rem;
      }

      .job-company {
        color: var(--accent-deep);
        font-size: 0.88rem;
        font-weight: 700;
      }

      .job-date {
        color: var(--muted);
        font-size: 0.72rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .job ul {
        margin: 10px 0 0;
        padding-left: 18px;
        color: var(--muted);
      }

      .job li + li { margin-top: 6px; }

      .gallery-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(200px, 1fr));
        gap: 18px;
      }

      .gallery-item {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 22px;
        overflow: hidden;
        box-shadow: 0 12px 24px rgba(26, 28, 29, 0.03);
      }

      .gallery-item .media {
        aspect-ratio: 4 / 3;
        overflow: hidden;
        background: linear-gradient(145deg, #f1e6d7, #d8e6e1);
      }

      .gallery-item img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .gallery-item .meta {
        padding: 16px 16px 18px;
      }

      .gallery-item h4 {
        margin: 0 0 6px;
        font-size: 1rem;
      }

      .gallery-item p {
        color: var(--muted);
        font-size: 0.83rem;
      }

      .cert-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 14px;
      }

      .cert {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 16px 14px;
        font-weight: 700;
        color: var(--ink);
      }

      .contact-box {
        background: linear-gradient(135deg, #1b1d1f 0%, #2d3135 100%);
        border-radius: 28px;
        color: white;
        padding: 30px 28px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 18px;
        flex-wrap: wrap;
      }

      .contact-box h3 {
        margin: 0 0 6px;
        font-size: clamp(1.8rem, 2.4vw, 2.6rem);
        letter-spacing: -0.05em;
      }

      .contact-box p {
        color: rgba(255,255,255,0.78);
      }

      .contact-actions {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }

      .contact-actions a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 46px;
        border-radius: 999px;
        padding: 0 18px;
        border: 1px solid rgba(255,255,255,0.18);
        color: white;
        font-size: 0.75rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        font-weight: 800;
      }

      .footer {
        padding: 30px 0 60px;
        text-align: center;
        color: var(--muted);
        font-size: 0.74rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      @media (max-width: 900px) {
        .hero-grid,
        .about-grid,
        .gallery-grid { grid-template-columns: 1fr; }
        .metrics { grid-template-columns: 1fr; }
      }

      @media (max-width: 600px) {
        .header-inner,
        .section-header,
        .job-head,
        .contact-box { display: block; }
        .nav { margin-top: 10px; }
        .hero { padding-top: 48px; }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <div class="brand">Ahmed Musa</div>
        <nav class="nav" aria-label="Main navigation">
          <a href="#about">About</a>
          <a href="#experience">Experience</a>
          <a href="#work">Work</a>
          <a href="#certifications">Certifications</a>
          <a href="#contact">Contact</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="hero">
        <div class="container hero-grid">
          <div>
            <div class="eyebrow">QHSE &amp; Process Safety</div>
            <h1 id="hero-title">QHSE Coordinator</h1>
            <p class="hero-sub" id="hero-summary"></p>
            <div class="hero-actions">
              <a class="button primary" href="#contact">Contact</a>
              <a class="button secondary" href="#work">View Work</a>
            </div>
          </div>

          <div class="portrait-wrap">
            <div class="portrait-card">
              <div class="portrait">
                <img src="assets/profile-placeholder.svg" alt="Ahmed Musa Mohammed" />
              </div>
              <div class="mini-badge">Available</div>
            </div>
          </div>
        </div>
      </section>

      <section id="about" class="section">
        <div class="container">
          <div class="section-header">
            <h2>About</h2>
            <span>Profile</span>
          </div>

          <div class="about-grid">
            <div class="panel">
              <p id="about-text"></p>
              <div class="metrics" id="metrics"></div>
            </div>

            <div class="stats" id="stats"></div>
          </div>
        </div>
      </section>

      <section id="experience" class="section">
        <div class="container">
          <div class="section-header">
            <h2>Experience</h2>
            <span>Career</span>
          </div>
          <div class="experience-list" id="experience-list"></div>
        </div>
      </section>

      <section id="work" class="section">
        <div class="container">
          <div class="section-header">
            <h2>Work</h2>
            <span>Gallery</span>
          </div>
          <div class="gallery-grid" id="gallery"></div>
        </div>
      </section>

      <section id="certifications" class="section">
        <div class="container">
          <div class="section-header">
            <h2>Certifications</h2>
            <span>Qualifications</span>
          </div>
          <div class="cert-grid" id="certs"></div>
        </div>
      </section>

      <section id="contact" class="section">
        <div class="container">
          <div class="contact-box">
            <div>
              <h3>Let’s connect</h3>
              <p id="contact-note"></p>
            </div>
            <div class="contact-actions">
              <a href="mailto:ahmedmusa482@gmail.com">Email</a>
              <a href="https://www.linkedin.com/in/ahmedmusa482" target="_blank" rel="noreferrer">LinkedIn</a>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer container">Ahmed Musa Mohammed • QHSE Coordinator</footer>
  </body>
</html>
