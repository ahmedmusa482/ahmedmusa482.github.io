<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Ahmed Musa Mohammed is a QHSE Coordinator and process safety professional with experience in QHSE systems, risk assessment, and operational excellence."
    />
    <title>Ahmed Musa Mohammed | QHSE Coordinator</title>
    <script defer src="profile.js"></script>
    <style>
      :root {
        --bg: #f5f3ee;
        --panel: #fffdfb;
        --panel-strong: #f1efe9;
        --ink: #1a1c1d;
        --muted: #575d60;
        --line: rgba(26, 28, 29, 0.12);
        --accent: #a36a1f;
        --accent-soft: #f2e3cb;
        --shadow: 0 18px 40px rgba(26, 28, 29, 0.08);
      }

      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        font-family: "Segoe UI", Arial, sans-serif;
        background: var(--bg);
        color: var(--ink);
        line-height: 1.7;
      }

      img {
        max-width: 100%;
        display: block;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .container {
        width: min(1200px, calc(100% - 32px));
        margin: 0 auto;
      }

      .site-header {
        position: sticky;
        top: 0;
        z-index: 20;
        backdrop-filter: blur(12px);
        background: rgba(245, 243, 238, 0.85);
        border-bottom: 1px solid var(--line);
      }

      .header-inner {
        display: flex;
        justify-content: space-between;
        align-items: center;
        min-height: 72px;
      }

      .brand {
        font-size: 0.85rem;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        font-weight: 700;
      }

      .nav {
        display: flex;
        gap: 24px;
        align-items: center;
        flex-wrap: wrap;
      }

      .nav a {
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--muted);
      }

      .nav a:hover { color: var(--ink); }

      .hero {
        padding: 72px 0 48px;
      }

      .hero-grid {
        display: grid;
        grid-template-columns: 1.15fr 0.85fr;
        gap: 40px;
        align-items: center;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-size: 0.75rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--accent);
        padding-bottom: 10px;
      }

      .eyebrow::before {
        content: "";
        width: 36px;
        height: 1px;
        background: var(--accent);
      }

      h1 {
        margin: 0;
        font-size: clamp(2.8rem, 5vw, 5rem);
        line-height: 0.98;
        letter-spacing: -0.06em;
      }

      .hero-sub {
        margin-top: 20px;
        max-width: 680px;
        font-size: 1.04rem;
        color: var(--muted);
      }

      .hero-actions {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
        margin-top: 28px;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 46px;
        border-radius: 999px;
        border: 1px solid var(--line);
        padding: 0 20px;
        font-size: 0.8rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        font-weight: 700;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .button:hover {
        transform: translateY(-1px);
        box-shadow: var(--shadow);
      }

      .button.primary {
        background: var(--ink);
        border-color: var(--ink);
        color: #fff;
      }

      .button.secondary {
        background: var(--panel);
        color: var(--ink);
      }

      .portrait-wrap {
        position: relative;
      }

      .portrait-card {
        position: relative;
        background: linear-gradient(180deg, #f8f6f3 0%, #efebe2 100%);
        border: 1px solid var(--line);
        border-radius: 32px;
        padding: 22px;
        box-shadow: var(--shadow);
      }

      .portrait {
        border-radius: 26px;
        overflow: hidden;
        background: linear-gradient(135deg, #e8e5df, #d7d0c6);
        border: 1px solid rgba(26, 28, 29, 0.08);
        aspect-ratio: 4 / 5;
      }

      .portrait img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .mini-badge {
        position: absolute;
        right: 16px;
        bottom: 16px;
        background: rgba(255,255,255,0.88);
        color: var(--ink);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 8px 12px;
        font-size: 0.72rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        font-weight: 700;
      }

      .section {
        padding: 28px 0 0;
      }

      .section-header {
        display: flex;
        justify-content: space-between;
        align-items: end;
        gap: 16px;
        margin-bottom: 20px;
      }

      .section-header h2 {
        margin: 0;
        font-size: clamp(1.9rem, 2.5vw, 3rem);
        letter-spacing: -0.06em;
      }

      .section-header span {
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.16em;
        font-size: 0.73rem;
      }

      .about-grid {
        display: grid;
        grid-template-columns: 1.2fr 0.8fr;
        gap: 24px;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 24px;
        box-shadow: 0 8px 22px rgba(26, 28, 29, 0.03);
        padding: 28px;
      }

      .panel p {
        margin: 0;
        color: var(--muted);
        font-size: 1.05rem;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(2, minmax(140px, 1fr));
        gap: 16px;
      }

      .stat {
        background: var(--panel-strong);
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 22px 18px;
      }

      .stat strong {
        display: block;
        font-size: clamp(1.6rem, 2vw, 2.2rem);
        letter-spacing: -0.06em;
      }

      .stat span {
        display: block;
        margin-top: 8px;
        color: var(--muted);
        font-size: 0.9rem;
      }

      .expertise {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
        gap: 16px;
      }

      .chip {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 18px 16px;
        font-weight: 600;
        color: var(--ink);
      }

      .experience-list {
        display: grid;
        gap: 20px;
      }

      .job {
        background: var(--panel);
        border: 1px solid var(--line);
        border-left: 4px solid var(--accent);
        border-radius: 22px;
        box-shadow: 0 8px 22px rgba(26, 28, 29, 0.03);
        padding: 22px 20px;
      }

      .job-head {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 6px;
      }

      .job h3 {
        margin: 0;
        font-size: 1.18rem;
      }

      .job-company {
        color: var(--accent);
        font-weight: 700;
        font-size: 0.9rem;
      }

      .job-date {
        color: var(--muted);
        font-size: 0.8rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .job ul {
        margin: 10px 0 0;
        padding-left: 18px;
        color: var(--muted);
      }

      .job li + li { margin-top: 6px; }

      .gallery-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(200px, 1fr));
        gap: 18px;
      }

      .gallery-item {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 22px;
        overflow: hidden;
        box-shadow: 0 8px 22px rgba(26, 28, 29, 0.03);
      }

      .gallery-item .media {
        aspect-ratio: 4 / 3;
        background: linear-gradient(160deg, #efe9e0 0%, #dfe3df 100%);
        overflow: hidden;
      }

      .gallery-item img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .gallery-item .meta {
        padding: 14px 16px 18px;
      }

      .gallery-item h4 {
        margin: 0 0 6px;
        font-size: 1rem;
      }

      .gallery-item p {
        margin: 0;
        font-size: 0.85rem;
        color: var(--muted);
      }

      .cert-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 16px;
      }

      .cert {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 18px 16px;
        color: var(--ink);
        font-weight: 600;
      }

      .contact-box {
        background: linear-gradient(135deg, #1b1d1f 0%, #2b2e31 100%);
        color: white;
        border-radius: 26px;
        padding: 28px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        flex-wrap: wrap;
      }

      .contact-box h3 {
        margin: 0 0 6px;
        font-size: clamp(1.6rem, 2vw, 2.4rem);
        letter-spacing: -0.05em;
      }

      .contact-box p {
        margin: 0;
        color: rgba(255,255,255,0.78);
      }

      .contact-actions {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }

      .contact-actions a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 46px;
        border-radius: 999px;
        padding: 0 18px;
        border: 1px solid rgba(255,255,255,0.2);
        color: white;
        font-size: 0.78rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        font-weight: 700;
      }

      .footer {
        padding: 32px 0 60px;
        color: var(--muted);
        font-size: 0.8rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        text-align: center;
      }

      @media (max-width: 900px) {
        .hero-grid,
        .about-grid,
        .gallery-grid { grid-template-columns: 1fr; }
      }

      @media (max-width: 600px) {
        .header-inner,
        .section-header,
        .job-head,
        .contact-box { display: block; }

        .nav { margin-top: 12px; }
        .hero { padding-top: 48px; }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <div class="brand">Ahmed Musa</div>
        <nav class="nav" aria-label="Main navigation">
          <a href="#about">About</a>
          <a href="#experience">Experience</a>
          <a href="#work">Work</a>
          <a href="#certifications">Certifications</a>
          <a href="#contact">Contact</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="hero">
        <div class="container hero-grid">
          <div>
            <div class="eyebrow">QHSE &amp; Process Safety</div>
            <h1 id="hero-title">QHSE Coordinator</h1>
            <p class="hero-sub" id="hero-summary"></p>
            <div class="hero-actions">
              <a class="button primary" href="#contact">Contact</a>
              <a class="button secondary" href="#work">View Work</a>
            </div>
          </div>

          <div class="portrait-wrap">
            <div class="portrait-card">
              <div class="portrait">
                <img src="assets/profile-placeholder.svg" alt="Ahmed Musa Mohammed" />
              </div>
              <div class="mini-badge">Available</div>
            </div>
          </div>
        </div>
      </section>

      <section id="about" class="section">
        <div class="container">
          <div class="section-header">
            <h2>About</h2>
            <span>Profile</span>
          </div>

          <div class="about-grid">
            <div class="panel">
              <p id="about-text"></p>
            </div>

            <div class="stats" id="stats"></div>
          </div>
        </div>
      </section>

      <section id="experience" class="section">
        <div class="container">
          <div class="section-header">
            <h2>Experience</h2>
            <span>Career</span>
          </div>
          <div class="experience-list" id="experience-list"></div>
        </div>
      </section>

      <section id="work" class="section">
        <div class="container">
          <div class="section-header">
            <h2>Work</h2>
            <span>Gallery</span>
          </div>
          <div class="gallery-grid" id="gallery"></div>
        </div>
      </section>

      <section id="certifications" class="section">
        <div class="container">
          <div class="section-header">
            <h2>Certifications</h2>
            <span>Qualifications</span>
          </div>
          <div class="cert-grid" id="certs"></div>
        </div>
      </section>

      <section id="contact" class="section">
        <div class="container">
          <div class="contact-box">
            <div>
              <h3>Let’s connect</h3>
              <p id="contact-note"></p>
            </div>
            <div class="contact-actions">
              <a href="mailto:ahmedmusa482@gmail.com">Email</a>
              <a href="https://www.linkedin.com/in/ahmedmusa482" target="_blank" rel="noreferrer">LinkedIn</a>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer container">Ahmed Musa Mohammed • QHSE Coordinator</footer>
  </body>
</html>
